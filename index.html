
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creaciones Jetly</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #8e44ad;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #f3f3f3;
      text-align: center;
      padding: 10px;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #8e44ad;
      font-weight: bold;
    }

    section {
      padding: 20px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .galeria img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .whatsapp img {
      width: 35px;
      height: 35px;
    }

    form {
      display: flex;
      flex-direction: column;
      max-width: 400px;
      margin: auto;
    }

    form input, form textarea {
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
    }

    form button {
      background-color: #8e44ad;
      color: white;
      padding: 10px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .precios ul {
      list-style: none;
      padding: 0;
    }

    .precios li {
      background: #eee;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<header>
  <h1>Creaciones Jetly</h1>
  <p>Confección de prendas y accesorios personalizados</p>
</header>

<nav>
  <a href="#galeria">Galería</a>
  <a href="#precios">Precios</a>
  <a href="#cotizar">Cotizar</a>
</nav>

<section id="galeria">
  <h2>Galería de Productos</h2>
  <div class="galeria">
    <img src="https://via.placeholder.com/200x250?text=Producto+1" alt="Producto 1">
    <img src="https://via.placeholder.com/200x250?text=Producto+2" alt="Producto 2">
    <img src="https://via.placeholder.com/200x250?text=Producto+3" alt="Producto 3">
  </div>
</section>

<section id="precios" class="precios">
  <h2>Precios Estimados</h2>
  <ul>
    <li>Blusa personalizada: $25</li>
    <li>Falda típica: $40</li>
    <li>Traje completo: $90</li>
  </ul>
</section>

<section id="cotizar">
  <h2>Solicita tu Cotización</h2>
  <form onsubmit="enviarCotizacion(); return false;">
    <input type="text" placeholder="Nombre" required>
    <input type="email" placeholder="Correo electrónico" required>
    <textarea placeholder="¿Qué deseas cotizar?" required></textarea>
    <button type="submit">Enviar</button>
  </form>
</section>

<a class="whatsapp" href="https://wa.me/573001112233" target="_blank" title="Escríbenos por WhatsApp">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
</a>

<script>
  function enviarCotizacion() {
    alert("Gracias por tu solicitud. Te responderemos pronto por correo.");
  }
</script>

</body>
</html>
